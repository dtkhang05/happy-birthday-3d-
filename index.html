<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <meta name="description" content="A magical interactive 3D birthday cinematic experience." />
    <title>Happy Birthday 🎂</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Outfit:wght@300;400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="loading-screen">
        <p class="loading-title">Preparing your surprise…</p>
        <div class="loading-bar-track">
          <div class="loading-bar-fill" id="loading-fill"></div>
        </div>
        <p class="loading-pct" id="loading-pct">0%</p>
      </div>
      <div id="rotate-overlay" hidden>
        <div class="rotate-card">
          <svg class="rotate-icon" viewBox="0 0 48 48" aria-hidden="true">
            <rect x="14" y="6" width="20" height="36" rx="4" fill="none" stroke="#fff" stroke-width="2.5" />
            <line x1="22" y1="38" x2="26" y2="38" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
            <path d="M38 8 A10 10 0 0 1 40 22" fill="none" stroke="#ff8844" stroke-width="3" stroke-linecap="round" />
            <path d="M40 14 L40 22 L32 22" fill="none" stroke="#ff8844" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <p class="rotate-title">Xoay ngang để trải nghiệm tốt nhất</p>
          <p class="rotate-sub">Rotate your device for the best experience</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
